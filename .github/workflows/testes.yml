name: Testes

on:
  push:
    branches: [main, dobramundo]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            requirements: requirements-ci-py38.txt
          - python-version: "3.12"
            requirements: requirements-ci-py312.txt
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Dependências (o jogo e os testes não precisam da webcam)
        run: python -m pip install -r ${{ matrix.requirements }}
      - name: Lint
        run: ruff check .
      - name: Testes
        run: python -m pytest -q --cov=dobramundo --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Self-test
        run: python -m dobramundo --self-test 60
      - name: Cobertura por comportamento (sem meta artificial de percentual)
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-python-${{ matrix.python-version }}
          path: coverage.xml

  executaveis:
    needs: testes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-webcam.txt
            requirements.txt
            constraints-build.txt
      - name: Dependências fixadas do build
        run: python -m pip install -r requirements-webcam.txt pyinstaller -c constraints-build.txt
      - name: Gerar e testar executável com detector
        run: python tools/build_desktop.py
      - name: Empacotar Linux preservando permissão de execução
        if: runner.os == 'Linux'
        run: tar -czf dist/Dobramundo-Linux.tar.gz -C dist Dobramundo
      - name: Executável e relatório técnico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dobramundo-${{ runner.os }}-${{ github.sha }}
          path: |
            dist/Dobramundo/
            dist/Dobramundo-Linux.tar.gz
            build/desktop-selftest/self_test.json
          retention-days: 14
