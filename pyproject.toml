[project]
name = "dobramundo"
dynamic = ["version"]
description = "Exergame sério de voo: um avião de papel reciclado, pilotado com o corpo, transforma cidades brasileiras em cidades solarpunk."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Liga de Psiquiatria e Neurociências – CENSUPEG" }]
dependencies = ["pygame>=2.5,<3"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "dobramundo.__version__" }  # a versão fica só em dobramundo/__init__.py

[tool.setuptools.packages.find]
include = ["dobramundo*"]

[project.optional-dependencies]
webcam = ["mediapipe>=0.10.9", "opencv-python-headless>=4.8"]

[project.scripts]
dobramundo = "dobramundo.main:main"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
